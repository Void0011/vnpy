name: Feishu conversation bot

on:
  push:
    branches: [codex/dca-live, codex/feishu-bot]
    paths:
      - 'scripts/dca_*.py'
      - 'scripts/feishu_bot.py'
      - 'tests/test_dca_bot.py'
      - 'tests/test_feishu_bot_transport.py'
      - 'requirements*reminder.txt'
      - 'requirements-feishu-bot.txt'
      - 'deploy/feishu-bot/**'
      - '.dockerignore'
      - '.github/workflows/feishu-bot.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-feishu-bot.txt ruff
      - run: python -m unittest discover -s tests -p 'test_dca_reminder.py' -v
      - run: python -m unittest discover -s tests -p 'test_dca_bot.py' -v
      - run: python -m unittest discover -s tests -p 'test_feishu_bot_transport.py' -v
      - run: ruff check scripts tests
      - name: Validate container build (no credentials or messages)
        run: docker build -f deploy/feishu-bot/Dockerfile -t feishu-dca-bot:test .
      - name: Validate container entry point
        run: docker run --rm feishu-dca-bot:test python -m scripts.feishu_bot --help
      - name: Validate SDK inside the actual container
        run: docker run --rm feishu-dca-bot:test python -c "import lark_oapi; from scripts.feishu_bot import FeishuTransport"
